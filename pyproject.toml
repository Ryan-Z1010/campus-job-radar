[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-job-radar"
version = "0.1.0"
description = "A privacy-first campus recruitment monitor for public job sources."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "CampusJobRadar contributors"}]
keywords = ["campus-recruitment", "job-monitor", "python", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
]
dependencies = []

[project.scripts]
job-radar = "job_radar.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
