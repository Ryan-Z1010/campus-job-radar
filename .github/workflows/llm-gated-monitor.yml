name: LLM gated job monitor

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: "手动运行时是否允许发送推荐和 LLM 复核后的人工审核提醒"
        required: true
        default: false
        type: boolean
      source_id:
        description: "可选：手动调试时只运行一个来源 ID；留空表示全量来源"
        required: false
        default: ""
        type: string
      include_demo:
        description: "手动调试时是否允许演示来源"
        required: true
        default: false
        type: boolean
      max_jobs:
        description: "本次最多交给 LLM 分析的岗位数"
        required: true
        default: 50
        type: number
      source_mode:
        description: "live 只扫描真实岗位接口；full 扫描完整公司池"
        required: true
        default: live
        type: choice
        options:
          - live
          - full
      agent_sweep:
        description: "专项筛查全部央企/国企中的 Agent 相关岗位"
        required: true
        default: false
        type: boolean
      resend_all:
        description: "专项筛查时忽略历史通知去重，重新发送全部匹配岗位"
        required: true
        default: false
        type: boolean
  schedule:
    # GitHub cron is UTC. Run at both possible UTC hours and let the shell
    # guard below keeps scheduled runs within a broad 06:00-09:00
    # Australia/Sydney window across daylight saving.
    - cron: "0 20 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: read

concurrency:
  group: llm-gated-job-monitor
  cancel-in-progress: false

jobs:
  llm-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e .

      - name: Restore LLM analysis cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/llm_analysis.sqlite3
            data/llm_notification.sqlite3
            data/llm_review_notification_v2.sqlite3
            data/users/
          key: llm-analysis-db-${{ github.run_id }}
          restore-keys: |
            llm-analysis-db-

      - name: Run LLM-gated monitor
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_BASE_URL: ${{ secrets.ARK_BASE_URL }}
          ARK_MODEL: ${{ secrets.ARK_MODEL }}
          LLM_PROFILE_JSON: ${{ secrets.LLM_PROFILE_JSON }}
          USERS_CONFIG_JSON: ${{ secrets.USERS_CONFIG_JSON }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_SSL: ${{ secrets.SMTP_USE_SSL }}
          ALLOW_EMAIL: ${{ github.event_name == 'schedule' || inputs.send_email }}
          SOURCE_ID: ${{ inputs.source_id }}
          INCLUDE_DEMO: ${{ inputs.include_demo || false }}
          MAX_JOBS: ${{ inputs.max_jobs || 50 }}
          SOURCE_MODE: ${{ inputs.source_mode || 'live' }}
          MONITORING_CONFIG: configs/monitoring.json
          AGENT_SWEEP: ${{ inputs.agent_sweep || false }}
          RESEND_ALL: ${{ inputs.resend_all || false }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ]; then
            sydney_time="$(TZ=Australia/Sydney date +%H%M)"
            if [ "$sydney_time" -lt 0600 ] || [ "$sydney_time" -ge 0900 ]; then
              echo "跳过本次 UTC 触发：当前悉尼时间不在 06:00-09:00 运行窗口（时间=$sydney_time）。"
              exit 0
            fi
          fi
          profile_path="configs/profile.example.json"
          if [ -n "${LLM_PROFILE_JSON:-}" ]; then
            profile_path="${RUNNER_TEMP}/profile.ci.json"
            printf '%s' "$LLM_PROFILE_JSON" > "$profile_path"
          fi
          users_path=""
          multi_user_mode="false"
          if [ -n "${USERS_CONFIG_JSON:-}" ]; then
            users_path="${RUNNER_TEMP}/users.ci.json"
            printf '%s' "$USERS_CONFIG_JSON" > "$users_path"
            multi_user_mode="true"
            echo "启用多人 LLM 模式：共享采集后按用户分别分析和通知。"
          fi

          sources_path="configs/sources.json"
          monitoring_path="${MONITORING_CONFIG:-configs/monitoring.json}"
          if [ "${AGENT_SWEEP:-false}" = "true" ]; then
            sources_path="${RUNNER_TEMP}/sources.state-agent.json"
            python - "$sources_path" "$multi_user_mode" <<'PY'
          import json
          import sys
          from job_radar.config import filter_sources_for_monitoring, load_monitoring, load_sources

          output = sys.argv[1]
          multi_user = len(sys.argv) > 2 and sys.argv[2] == "true"
          all_sources = load_sources("configs/sources.json")
          if not multi_user:
              all_sources = filter_sources_for_monitoring(
                  all_sources, load_monitoring("configs/monitoring.json")
              )
          sources = [
              source
              for source in all_sources
              if source.get("company_type") in {"央企", "国企"}
          ]
          with open(output, "w", encoding="utf-8") as handle:
              json.dump({"sources": sources}, handle, ensure_ascii=False)
          print("央国企 Agent 专项来源数: {}".format(len(sources)))
          PY
          elif [ "${GITHUB_EVENT_NAME:-}" = "schedule" ] || [ "${SOURCE_MODE:-live}" = "live" ]; then
            sources_path="${RUNNER_TEMP}/sources.live.json"
            python - "$sources_path" "${GITHUB_EVENT_NAME:-}" "$multi_user_mode" <<'PY'
          import json
          import sys
          from job_radar.config import filter_sources_for_monitoring, load_monitoring, load_sources

          output = sys.argv[1]
          scheduled = len(sys.argv) > 2 and sys.argv[2] == "schedule"
          multi_user = len(sys.argv) > 3 and sys.argv[3] == "true"
          all_sources = load_sources("configs/sources.json")
          monitoring = load_monitoring("configs/monitoring.json")
          if not multi_user:
              all_sources = filter_sources_for_monitoring(all_sources, monitoring)
          if scheduled and (multi_user or monitoring.get("daily_scan_all")):
              # The scheduled monitor intentionally checks every remaining
              # official source; already-applied companies are removed before
              # collection and again at the job level in the CLI.
              sources = all_sources
          else:
              # Manual live runs retain the faster structured-source mode.
              sources = [
                  source
                  for source in all_sources
                  if source.get("type") != "campaign_watch"
                  or source.get("daily_monitor")
              ]
          with open(output, "w", encoding="utf-8") as handle:
              json.dump({"sources": sources}, handle, ensure_ascii=False)
          print("每日来源数: {}{}".format(len(sources), "（全量）" if scheduled else "（live）"))
          PY
          elif [ "${SOURCE_MODE:-full}" != "full" ]; then
            echo "SOURCE_MODE 必须是 live 或 full" >&2
            exit 2
          fi

          if [ "$multi_user_mode" = "true" ]; then
            args=(
              llm-multi-analyze
              --users "$users_path"
              --users-root "$GITHUB_WORKSPACE"
              --sources "$sources_path"
              --max-jobs "$([ "${GITHUB_EVENT_NAME:-}" = "schedule" ] && echo 50 || echo "${MAX_JOBS:-50}")"
              --collection-workers 64
              --analysis-workers 4
              --notify-min-score 70
              --output reports/llm/multi/latest.json
              --notification-preview-dir reports/llm/multi/notification-preview
            )
          else
            args=(
              llm-analyze
              --profile "$profile_path"
              --sources "$sources_path"
              --max-jobs "$([ "${GITHUB_EVENT_NAME:-}" = "schedule" ] && echo 50 || echo "${MAX_JOBS:-50}")"
              --monitoring "$monitoring_path"
              --collection-workers 64
              --analysis-workers 4
              --notify-min-score 70
              --output reports/llm/latest.json
              --cache-database data/llm_analysis.sqlite3
              --notification-database data/llm_notification.sqlite3
              --review-notification-database data/llm_review_notification_v2.sqlite3
              --notification-preview-dir reports/llm/notification-preview
            )
          fi
          if [ "${INCLUDE_DEMO:-false}" = "true" ]; then
            args+=(--include-demo)
          fi
          if [ -n "${SOURCE_ID:-}" ]; then
            args+=(--source "$SOURCE_ID")
          fi
          if [ "${AGENT_SWEEP:-false}" = "true" ]; then
            args+=(
              --job-keyword "agent"
              --job-keyword "智能体"
              --job-keyword "智能代理"
              --job-keyword "多智能体"
              --job-keyword "大模型应用"
              --job-keyword "智能助手"
            )
          fi
          if [ "${RESEND_ALL:-false}" = "true" ]; then
            if [ "$multi_user_mode" = "true" ]; then
              args+=(--resend-all)
            else
              args+=(
                --notification-database "${RUNNER_TEMP}/agent-sweep-notification.sqlite3"
                --review-notification-database "${RUNNER_TEMP}/agent-sweep-review.sqlite3"
              )
            fi
          fi
          if [ "${ALLOW_EMAIL:-false}" = "true" ] \
            && { [ "$multi_user_mode" = "true" ] || [ -n "${ALERT_EMAIL:-}" ]; } \
            && [ -n "${SMTP_HOST:-}" ] \
            && [ -n "${SMTP_USERNAME:-}" ] \
            && [ -n "${SMTP_PASSWORD:-}" ]; then
            args+=(--send-email)
          fi
          python -m job_radar "${args[@]}"

      - name: Save LLM analysis cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/llm_analysis.sqlite3
            data/llm_notification.sqlite3
            data/llm_review_notification_v2.sqlite3
            data/users/
          key: llm-analysis-db-${{ github.run_id }}

      - name: Upload LLM reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-job-radar-report-${{ github.run_id }}
          path: reports/llm/
          if-no-files-found: warn
          retention-days: 14
