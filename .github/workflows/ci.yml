name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Run deterministic multi-agent production smoke test
        run: |
          python -m job_radar agent-monitor \
            --dry-run \
            --include-demo \
            --source demo_official_jobs \
            --database /tmp/job-radar.db \
            --report-dir /tmp/job-radar-report \
            --trace-file /tmp/job-radar-agent-trace.json
